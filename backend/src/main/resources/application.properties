# =====================================================================
#  Aroma Café · réglages du serveur
#  Chaque valeur peut être remplacée par une variable d'environnement (sur Render : onglet « Environment »).
#  Syntaxe ${VARIABLE:valeur} : on prend VARIABLE si elle existe, sinon la valeur après les deux-points.
#  Les vraies valeurs secrètes ne sont JAMAIS écrites ici : ce fichier est public sur GitHub.
# =====================================================================
spring.application.name=aroma-cafe

# Port : Render donne le sien dans la variable PORT ; sur ton PC, ce sera 8080
server.port=${PORT:8080}

# Derrière le proxy de Render : comprendre qu'on est en https (redirections, cookies)
server.forward-headers-strategy=native

# ---------- Tables et QR codes ----------
aroma.tables=${AROMA_TABLES:10}
# Secret qui signe les QR codes. En ligne : le mettre dans AROMA_TABLE_SECRET.
# Le changer invalide tous les QR codes déjà imprimés.
aroma.table-secret=${AROMA_TABLE_SECRET:changez-moi-aroma-2026}

# ---------- Tablette caisse ----------
aroma.caisse.username=${AROMA_CAISSE_USERNAME:caisse}
aroma.caisse.password=${AROMA_CAISSE_PASSWORD:aroma2026}

# ---------- Qui peut commander ? ----------
# caisse-ouverte : depuis n'importe quel réseau (Wi-Fi, 4G…), seulement quand le service est démarré sur la caisse
# wifi-cafe      : en plus, seulement depuis le Wi-Fi du café (ne marche pas sur ton PC : localhost ≠ Wi-Fi)
# toujours       : aucune vérification (tests rapides avec curl, sans caisse ouverte)
aroma.commandes=${AROMA_COMMANDES:caisse-ouverte}

# ---------- Base de données ----------
# Par défaut : fichier H2 dans ./data (sur ton PC).
# En ligne : SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME et SPRING_DATASOURCE_PASSWORD
# (variables d'environnement) remplacent automatiquement ces trois lignes par PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/aroma;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Session de la caisse ----------
spring.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax
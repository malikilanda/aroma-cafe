# =====================================================================
#  Aroma Café · Commande à table · Configuration du serveur
# =====================================================================

spring.application.name=aroma-cafe
server.port=8080

# ---------- Salle ----------
# Nombre de tables équipées d'un QR code
aroma.tables=10

# Secret qui signe les QR codes des tables (empêche de commander pour une autre table
# en modifiant le lien). À CHANGER avant d'imprimer les QR codes : le changer ensuite
# rend inutilisables les QR codes déjà posés sur les tables.
aroma.table-secret=changez-moi-aroma-2026

# ---------- Connexion de la tablette caisse ----------
# À CHANGER avant la mise en service
aroma.caisse.username=caisse
aroma.caisse.password=aroma2026

# ---------- Base de données ----------
# Fichier H2 local dans le dossier ./data (les commandes sont conservées entre deux redémarrages)
spring.datasource.url=jdbc:h2:file:./data/aroma;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée et met à jour les tables automatiquement à partir des classes Java
spring.jpa.hibernate.ddl-auto=update
# Pas de requêtes SQL pendant l'affichage des pages (supprime aussi l'avertissement au démarrage)
spring.jpa.open-in-view=false

# ---------- Session de la caisse ----------
# La tablette reste connectée toute une journée de service
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax